name: Deploy Pipeline to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'packages/pipeline/**'
      - 'packages/pipeline/config/**'
  workflow_dispatch:

jobs:
  deploy-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Copy config into pipeline package'
        run: cp -r ./config ./packages/pipeline/config

      - name: 'Reset pipeline config to production values'
        run: |
          python3 -c "
          import json
          path = 'packages/pipeline/pipeline_config.json'
          with open(path) as f:
              cfg = json.load(f)
          cfg['eip_cloudflare_sync'] = 'production'
          cfg['skip_sharepoint'] = False
          with open(path, 'w') as f:
              json.dump(cfg, f, indent=2)
          print('pipeline_config.json reset to production values ✅')
          "

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: 'peter-consolidate-meeting-transcripts'
          package: './packages/pipeline'
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      - name: 'Create GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          generate_release_notes: true
          body: |
            Automated release from GitHub Actions.
            Run ID: ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
